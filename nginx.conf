# ==============================================================================
# Nginx Configuration for Chef Fergany API on Hostinger Ubuntu VPS
# Location on server: /etc/nginx/sites-available/chef-fergany.conf
# Enable via: sudo ln -s /etc/nginx/sites-available/chef-fergany.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zone: max 15 requests per second per IP for API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

upstream chef_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.cheffergany.com your-vps-ip; # Replace with your domain or VPS IP

    # Redirect all HTTP traffic to HTTPS (Certbot will manage SSL certificate)
    # return 301 https://$host$request_uri;

    # Static uploads directory served directly by Nginx with high performance & caching
    location /uploads/ {
        alias /var/www/chef-fergany/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, no-transform";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # API Proxy pass to Node.js / Express Backend
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://chef_backend;
        proxy_http_version 1.1;

        # Upgrade headers for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for uploads and slow queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS preflight handling if accessed directly
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://newchef-azure.vercel.app' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            return 204;
        }

        # Max file upload size (matches Sharp / Multer 10MB)
        client_max_body_size 10M;
    }

    # Root fallback
    location / {
        proxy_pass http://chef_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
